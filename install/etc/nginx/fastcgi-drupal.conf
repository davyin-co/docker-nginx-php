## Shared PHP-FPM parameters for Drupal.
##
## Included from every location that hands a request to PHP-FPM:
##   - conf.d/default.conf        = /index.php (front controller)
##   - conf.d/default.conf        maintenance entrypoints (install/authorize/
##                                rebuild/update; prod-denied via DRUPAL_DENY_PHP)
##   - conf.d/default.conf        = /core/modules/statistics/statistics.php
##
## Keep this the single source of truth for fastcgi tuning. At container
## start /etc/entrypoint.d/61-drupal.sh rewrites the fastcgi_read_timeout
## directive here to `$TIMEOUT` (when TIMEOUT is set); it affects every
## PHP entrypoint. The comment deliberately avoids quoting the original
## directive so the sed pass only touches the real line.

fastcgi_hide_header X-Generator;
fastcgi_read_timeout 60;
fastcgi_buffer_size 256k;
fastcgi_buffers 32 64k;
fastcgi_temp_path /tmp/nginx-fastcgi;
fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
include /etc/nginx/fastcgi_params;
fastcgi_param HTTP_PROXY "";
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param PATH_INFO $fastcgi_path_info;
fastcgi_param QUERY_STRING $query_string;
fastcgi_intercept_errors on;
## serversideup php-fpm listens on TCP 9000 (not a unix socket)
fastcgi_pass 127.0.0.1:9000;
