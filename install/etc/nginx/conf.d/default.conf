## Drupal site with DSF EDGE header-driven sub-path support
## (based on drupal.conf; without the DSF headers every directive below
##  behaves exactly like the stock configuration)
##
## Program contract (forward requests UNMODIFIED, prefix kept in the URI):
##   Host:                public hostname (must equal X-DSF-SUBDIR-HOST)
##   X-Forwarded-For:     appended client IP
##   X-Forwarded-Proto:   https
##   X-DSF-SUBDIR-HOST:   public hostname, must equal the Host header
##   X-DSF-SUBDIR-PREFIX: sub-path prefix, e.g. /prefix (leading slash, no trailing slash)
##
## Mechanism:
##   - dynamic half: fastcgi SCRIPT_NAME gets the prefix while REQUEST_URI
##     keeps it -> Drupal derives the correct base path (no URI rewrite!)
##   - static half: every try_files first tests the prefix-stripped candidate
##   - bare prefix (e.g. GET /prefix): 301 to /prefix/ (an empty stripped
##     path would make Drupal 404 on empty pathInfo)
##
## NOTE: deliberately NO server-level `rewrite`. A server-level rewrite
## re-runs on every internal redirect while map results are cached per
## request, which caused "internal redirection cycle" loops
## (try_files -> /index.php -> stale rewrite -> back).
##
## NOTE: map{} lives at http level; this file is installed as
## /etc/nginx/conf.d/default.conf which is included from there. If it is
## ever included by multiple vhost files, move the maps into a shared
## http-level include instead.

## [DSF] header-driven sub-path maps ────────────────────────────────────────

# Prefix format validation: "/name" only
map $http_x_dsf_subdir_prefix $dsf_prefix_ok {
    default        '';
    '~^/[\w.-]+$'  $http_x_dsf_subdir_prefix;
}

# Activate only when X-DSF-SUBDIR-HOST equals the actual Host header
map "$http_x_dsf_subdir_host::$dsf_prefix_ok::$host" $dsf_subdir {
    default                                   '';
    '~^(?<dh>[\w.-]+)::(?<dp>/[\w.-]+)::\1$'  $dp;
}

# Prefix-stripped URI candidate for try_files. Input is "<prefix>::<uri>"
# (the prefix appears TWICE: as the key and as the head of the URI); the \1
# backreference consumes the second copy so dsf_r is genuinely stripped.
# Non-matching inputs fall back to $uri, which makes it idempotent across
# the internal redirects that try_files performs.
map "$dsf_subdir::$uri" $dsf_fs_uri {
    default                                 $uri;
    '~^(?<dh>/[\w.-]+)::\1(?<dsf_r>/.+)\z'  $dsf_r;
}

# Bare-prefix detection: URI exactly equals the prefix ("/prefix"). The
# stripped path would be empty (Drupal 404 on empty pathInfo), so redirect
# to the trailing-slash form instead.
map "$dsf_subdir::$uri" $dsf_bare_prefix {
    default                       '';
    '~^(?<dh>/[\w.-]+)::\1\z'     '1';
}

## ────────────────────────────────────────────────────── end [DSF] maps

## Drupal site — installed as /etc/nginx/conf.d/default.conf
## serversideup's 10-init-webserver-config.sh keeps this file as-is when it
## exists (it only symlinks its own default site when conf.d/default.conf is
## absent), so this server block is the single source of truth for the site.
##
## Runtime rewrites performed by /etc/entrypoint.d/61-davyin-drupal.sh:
##   listen 80;                        → $NGINX_HTTP_PORT
##   root /var/www/html;               → $DRUPAL_WEB_ROOT appended when set
##   add_header X-Frame-Options …      → $HTTP_HEADER_X_FRAME_OPTIONS
##   add_header Content-Security-Policy → replaced by $HTTP_HEADER_X_CONTENT_SECURITY_POLICY
##                                       or removed unless …_ENABLE is true
##   fastcgi_read_timeout 60;          → $TIMEOUT when set
##
## Reference: https://www.nginx.com/resources/wiki/start/topics/recipes/drupal/

server {
    listen 80;
    root /var/www/html;
    server_name _;

    add_header X-Frame-Options SAMEORIGIN;
    add_header Content-Security-Policy "default-src 'self';";
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Download-Options noopen;
    add_header X-Permitted-Cross-Domain-Policies none;
    add_header Referrer-Policy no-referrer-when-downgrade;
    add_header Strict-Transport-Security "max-age=0";

    include /etc/nginx/vhost.d/pre-*.conf;

    ## For Security.
    location ~* robots.txt|README.txt|README.md|CHANGELOG.txt|INSTALL.txt|.htaccess|config.rb|web.config|composer\.(json|lock)|(package|package-lock)\.json|yarn\.lock|transliteration_data.php.txt {
        return 404;
    }
    location ~* /sites/[^/]+/[^/]+\.php$ {
        deny all;
        return 404;
    }

    location ~* \.(js\.map|engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml|yaml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|^(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|(package|package-lock)\.json|yarn\.lock)$|^#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
        return 404;
    }

    location @rewrite_subdir {
        rewrite ^ /index.php;
    }

    include /etc/nginx/extra/subdir.conf;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location ~ \..*/.*\.php$ {
        return 403;
    }

    location ~ ^/sites/.*/private/ {
        return 403;
    }

    location ~* ^/.well-known/ {
        allow all;
    }

    location ~ (^|/)\. {
        return 403;
    }

    location = / {
        try_files $dsf_fs_uri $uri $drupal_boost_try_homepage_final /index.php?$query_string;
    }

    location / {
        ## [DSF] bare prefix "/prefix" -> 301 "/prefix/" (empty stripped path
        ## would 404). `return` inside if is safe: it cannot loop.
        if ($dsf_bare_prefix) {
            return 301 $dsf_subdir/;
        }
        try_files $dsf_fs_uri $uri $drupal_boost_try_final /index.php?$query_string;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?q=$1;
    }

    location ~ /vendor/.*\.php$ {
        deny all;
        return 404;
    }

    location ~ ^(?!/core/modules/statistics/statistics\.php$).+/.+/.+/.+\.php$ {
        deny all;
        return 404;
    }

    location ~ '\.php$|^/update.php' {
        if ($request_uri ~* "^(.*/)index\.php(.*)") {
            return 307 $1$2;
        }

        fastcgi_hide_header X-Generator;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 256k;
        fastcgi_buffers 32 64k;
        fastcgi_temp_path /tmp/nginx-fastcgi;
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        include fastcgi_params;
        ## [DSF] alias dynamic half: public sub-path as PHP script name.
        ## Placed after `include fastcgi_params;` so PHP takes this value last.
        ## Empty when the DSF headers are absent.
        fastcgi_param SCRIPT_NAME $dsf_subdir$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;
        # serversideup php-fpm listens on TCP 9000 (not a unix socket)
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ ^/sites/.*/files/styles/ {
        try_files $dsf_fs_uri $uri @rewrite;
    }

    location ~ ^/sites/.*/files/ {
        log_not_found off;
        expires 1y;
        add_header Pragma public;
        add_header Cache-Control "public, max-age=2592000";
        add_header locationheader 1;
        add_header X-Micro-Cache $upstream_cache_status;
        try_files $dsf_fs_uri $uri @rewrite;
    }

    location ~ ^/sites/.*/files/styles/.*/public/ {
        try_files $dsf_fs_uri $uri @rewrite;
    }

    location ~* ^(?!/system/files).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|mp4|mkv|mov|wmv|avi)$ {
        try_files $dsf_fs_uri $uri @rewrite;
        expires 7d;
        log_not_found off;
    }

    location @nobots {
        if ($is_bot) {
            rewrite ^ $scheme://$host$uri? permanent;
        }
        rewrite ^/(.*)$  /index.php?q=$1 last;
    }

    location ~* files/advagg_(?:css|js)/ {
        expires    max;
        etag       off;
        rewrite    ^/files/advagg_(.*)/(.*)$ /sites/$server_name/files/advagg_$1/$2 last;
        add_header ETag '';
        add_header Accept-Ranges '';
        add_header Cache-Control "no-transform, public";
        add_header Last-Modified "Wed, 20 Jan 1988 04:20:42 GMT";
        add_header X-Header "AdvAgg Generator 1.0";
        set $nocache_details "Skip";
        try_files  $dsf_fs_uri $uri @nobots;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|mp4|mkv|mov|wmv|avi)$ {
        log_not_found off;
        expires 1y;
        add_header Pragma public;
        add_header Cache-Control "public, max-age=2592000";
        add_header locationheader 1;
        add_header X-Micro-Cache $upstream_cache_status;
        open_file_cache max=3000 inactive=120s;
        open_file_cache_valid 45s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;
        try_files $dsf_fs_uri $uri @rewrite;
    }

    location ~* \.(otf|eot|ttf|woff) {
        expires 1y;
        add_header Cache-Control "public, max-age=2592000";
        open_file_cache max=3000 inactive=120s;
        open_file_cache_valid 45s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;
        try_files $dsf_fs_uri $uri @rewrite;
    }

    location ~* \.mjs$ {
        types {
            text/javascript mjs;
        }
    }

    if ( $request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD)$ ) {
        return 405;
    }

    include /etc/nginx/vhost.d/post-*.conf;
}
