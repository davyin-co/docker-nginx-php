# Managed by docker-nginx-php image. sshd uses first-match-wins and the
# Dockerfile inserts `Include /etc/ssh/sshd_config.d/*.conf` at the top of the
# main sshd_config, so these values take precedence.
Port 2222
PasswordAuthentication no
PermitRootLogin no
X11Forwarding no
AllowTcpForwarding yes
# Home dirs live on the webroot volume (not owned by the ssh user), which
# breaks StrictModes on ~/.ssh — keep keys in a root-owned location instead.
AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
