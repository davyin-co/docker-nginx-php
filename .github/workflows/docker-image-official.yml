name: Docker Image CI Official-PHP Base

# 官方 php 基座（草案）的并行发布 workflow：tag 统一带 -official 后缀观察验证，
# 稳定后再考虑切换正式 tag（见 docs/plan-official-php-base.md）。
# 与 serversideup 基座 workflow 独立，互不影响。

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.official.template"
      - "base/**"
      - "install/**"
      - ".github/workflows/docker-image-official.yml"
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      name:
        description: "Reason"
        required: true
        default: "Why??"

# 同一 ref 上的运行互斥，push 触发时取消上一次仍在执行的计划任务，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# 最小权限原则：仅读取仓库内容
permissions:
  contents: read

jobs:
  # 与 serversideup 基座 workflow 同构：每 PHP 版本 × 架构一条 build leg，
  # arm64 用原生 ARM runner 避免 QEMU；单架构镜像先推 {tag}-official-{arch}，
  # merge job 合成多架构 manifest。
  build:
    strategy:
      fail-fast: false
      matrix:
        array:
          [
            {
              php_version: "8.3",
              variant: "alpine",
              base_tag: "8.3-fpm-alpine3.24",
              tag: "8.3-alpine-official"
            },
            {
              php_version: "8.4",
              variant: "alpine",
              base_tag: "8.4-fpm-alpine3.24",
              tag: "8.4-alpine-official"
            },
            {
              php_version: "8.5",
              variant: "alpine",
              base_tag: "8.5-fpm-alpine3.24",
              tag: "8.5-alpine-official"
            },
            {
              php_version: "8.3",
              variant: "debian",
              base_tag: "8.3-fpm-bookworm",
              tag: "8.3-debian-official"
            },
            {
              php_version: "8.4",
              variant: "debian",
              base_tag: "8.4-fpm-bookworm",
              tag: "8.4-debian-official"
            },
            {
              php_version: "8.5",
              variant: "debian",
              base_tag: "8.5-fpm-bookworm",
              tag: "8.5-debian-official"
            },
          ]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Login to ALIYUN CR
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUNCR_USERNAME }}
          password: ${{ secrets.ALIYUNCR_PASSWORD }}
      - name: Build and push (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          platforms: linux/${{ matrix.arch }}
          file: "Dockerfile.official.template"
          tags: |
            davyinsa/docker-nginx-php:${{ matrix.array.tag }}-${{ matrix.arch }}
            registry.cn-hangzhou.aliyuncs.com/davyin/nginx-php:${{ matrix.array.tag }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.array.tag }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.array.tag }}-${{ matrix.arch }}
          build-args: |
            PHP_VERSION=${{ matrix.array.php_version }}
            VARIANT=${{ matrix.array.variant }}
            BASE_TAG=${{ matrix.array.base_tag }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        array:
          [
            { tag: "8.3-alpine-official" },
            { tag: "8.4-alpine-official" },
            { tag: "8.5-alpine-official" },
            { tag: "8.3-debian-official" },
            { tag: "8.4-debian-official" },
            { tag: "8.5-debian-official" },
          ]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Login to ALIYUN CR
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUNCR_USERNAME }}
          password: ${{ secrets.ALIYUNCR_PASSWORD }}
      - name: Merge multi-arch manifest for ${{ matrix.array.tag }}
        run: |
          set -euo pipefail
          TAG="${{ matrix.array.tag }}"
          docker buildx imagetools create \
            -t "davyinsa/docker-nginx-php:${TAG}" \
            "davyinsa/docker-nginx-php:${TAG}-amd64" \
            "davyinsa/docker-nginx-php:${TAG}-arm64"
          docker buildx imagetools create \
            -t "registry.cn-hangzhou.aliyuncs.com/davyin/nginx-php:${TAG}" \
            "registry.cn-hangzhou.aliyuncs.com/davyin/nginx-php:${TAG}-amd64" \
            "registry.cn-hangzhou.aliyuncs.com/davyin/nginx-php:${TAG}-arm64"
