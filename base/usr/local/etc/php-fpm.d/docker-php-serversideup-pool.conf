; dsf php-fpm pool — self-authored for the official-php base image.
;
; Same contract as the serversideup-based image: ${VAR} placeholders are
; expanded from the process environment (php-fpm expands pool-config env
; vars; clear_env = no keeps the container environment available), and
; 06-compat.sh sed-renders the canonical PHP_FPM_PM_* subset before startup.
; 05-fpm-pool-user.sh appends the `user`/`group` lines when running as root.
; Placeholder names unchanged so 06-compat.sh works as-is.

[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192
process_control_timeout = ${PHP_FPM_PROCESS_CONTROL_TIMEOUT}

[${PHP_FPM_POOL_NAME}]
listen = 9000

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

pm = ${PHP_FPM_PM_CONTROL}
pm.max_children = ${PHP_FPM_PM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_PM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_PM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_PM_MAX_REQUESTS}

pm.status_path = ${PHP_FPM_PM_STATUS_PATH}
ping.path = /healthcheck
ping.response = OK
